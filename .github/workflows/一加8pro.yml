name: Build OnePlus SM8250 Kernel (Fixed)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          # 关键点：安装 python2 及其环境
          sudo apt-get install -y bc bison build-essential flex git curl libssl-dev libncurses5-dev binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi libelf-dev
          # Ubuntu 22.04 安装 python2 的特殊处理
          sudo apt-get install -y python2
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Clone Source and Toolchain
        run: |
          git clone --depth=1 https://github.com/OnePlusOSS/android_kernel_oneplus_sm8250.git -b oneplus/sm8250_t_13.1_op8 kernel
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang
          echo "$(pwd)/clang/bin" >> $GITHUB_PATH

      - name: Hard-Fix Oplus Kernel Gaps (Safe)
        run: |
          set -e
          cd kernel
      
          echo "🧹 Step 1: Remove Oplus-only Kconfig references (explicit list)..."
      
          REMOVE_KCONFIG_PATHS=(
            "kernel/sched_assist/Kconfig"
            "kernel/tuning/Kconfig"
            "block/uxio_first/Kconfig"
            "mm/healthinfo/Kconfig"
            "mm/memory_isolate/Kconfig"
            "mm/multi_kswapd/Kconfig"
            "mm/pms/Kconfig"
            "mm/task_mem/Kconfig"
            "mm/malloc_track/Kconfig"
            "mm/cpu_report/Kconfig"
            "drivers/video/fbdev/msm/oplus_display/Kconfig"
            "drivers/soc/oplus/performance/Kconfig"
            "fs/proc/healthinfo/Kconfig"
          )
      
          for k in "${REMOVE_KCONFIG_PATHS[@]}"; do
            echo "  🔥 Removing source \"$k\""
            grep -rl "source \"$k\"" . | xargs -r sed -i "\|source \"$k\"|d"
          done
      
          echo
          echo "🧹 Step 2: Remove Oplus-only Makefile obj-* references..."
      
          REMOVE_OBJ_DIRS=(
            "sched_assist"
            "tuning"
            "uxio_first"
            "healthinfo"
            "memory_isolate"
            "multi_kswapd"
            "pms"
            "task_mem"
            "malloc_track"
            "cpu_report"
            "oplus_display"
            "performance"
          )
      
          for d in "${REMOVE_OBJ_DIRS[@]}"; do
            echo "  🔥 Removing obj references for $d"
            grep -rlE "obj-.*\+=.*$d(/|$)" . | xargs -r sed -i "/$d/d"
          done
      
          echo
          echo "🧼 Step 3: Fix OplusKernelEnvConfig.mk safely..."
      
          if [ -f OplusKernelEnvConfig.mk ]; then
            if grep -q "FILENAME=- FNR=1" OplusKernelEnvConfig.mk; then
              sed -i 's/FILENAME=- FNR=1/FNR==1/' OplusKernelEnvConfig.mk
              echo "  ✔ Fixed awk condition in OplusKernelEnvConfig.mk"
            else
              echo "  ✔ No known awk issue detected"
            fi
          fi
      
          echo
          echo "🐍 Step 4: Ensure python3 (do NOT force python2)..."
      
          grep -rl "^#!.*python$" scripts/ | xargs -r sed -i 's|python$|python3|'
      
          echo
          echo "🛡️ Step 5: Defensive cleanup — SAFE Kconfig source fix..."
      
          ROOT_DIR=$(pwd)
      
          find . -name 'Kconfig*' \
            ! -path './scripts/kconfig/tests/*' \
            ! -path './tools/*' \
            -type f | while read -r kfile; do
      
              grep '^[[:space:]]*source "' "$kfile" | while read -r line; do
                kpath=$(echo "$line" | sed -n 's/.*source "\(.*\)".*/\1/p')
      
                # 跳过带变量的合法写法
                if echo "$kpath" | grep -q '\$('; then
                  continue
                fi
      
                real="$ROOT_DIR/$kpath"
      
                if [ ! -f "$real" ]; then
                  echo "  ❌ Missing Kconfig: $kpath → removed from $kfile"
                  sed -i "\|source \"$kpath\"|d" "$kfile"
                fi
              done
            done
      
          echo
          echo "✅ Oplus kernel hard-fix completed safely."


      - name: Compile Kernel
        run: |
          cd kernel
          export ARCH=arm64
          export SUBARCH=arm64
          
          # 创建输出目录
          mkdir -p out
          
          # 配置与编译，显式指定 Python 为 python2
          make O=out vendor/kona-perf_defconfig PYTHON=python2
          make -j$(nproc --all) O=out \
                      CC=clang \
                      PYTHON=python2 \
                      CROSS_COMPILE=aarch64-linux-gnu- \
                      CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
                      NM=llvm-nm \
                      OBJCOPY=llvm-objcopy \
                      OBJDUMP=llvm-objdump \
                      STRIP=llvm-strip \
                      LD=ld.lld \
                      AR=llvm-ar

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Image
          path: kernel/out/arch/arm64/boot/Image*
