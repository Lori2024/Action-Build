name: Build OnePlus SM8250 Kernel

on:
  workflow_dispatch: # 手动触发

jobs:
  build:
    # 按照要求使用 22.04，以支持 libncurses5 依赖列表
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_oneplus_sm8250
          ref: lineage-20
          path: kernel
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          # 完全使用你最初提供的依赖列表
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            gcc-multilib g++-multilib libc6-dev-i386 libncurses5 lib32ncurses5-dev x11proto-core-dev \
            libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc tar xz-utils cpio findutils \
            libssl-dev bc # 编译 4.19+ 内核通常需要这两个包处理脚本和证书

      - name: Setup Toolchain (Proton Clang)
        run: |
          mkdir clang
          cd clang
          # 使用你提供的真实下载链接
          curl -LO https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.tar.gz
          tar -xf master.tar.gz --strip-components=1

      - name: Fetch AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git --depth=1 anykernel

      - name: Build Kernel
        run: |
          # 设置 Clang 路径
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          
          # 按照编译指南设置环境变量
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          cd kernel
          mkdir out
          
          # 加载 SM8250 (骁龙865) 对应的 LineageOS 配置文件
          # 提示：该源码仓库的标准配置通常为 vendor/kona-perf_defconfig
          make O=out vendor/kona-perf_defconfig
          
          # 执行编译
          make -j$(nproc --all) O=out

      - name: Package with AnyKernel3
        run: |
          # 编译产物检查
          IMAGE=$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image
          if [ -f "$IMAGE" ]; then
            cp "$IMAGE" $GITHUB_WORKSPACE/anykernel/
            cd $GITHUB_WORKSPACE/anykernel
            # 修改 AnyKernel 脚本以适配
            sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
            zip -r9 ../OnePlus_SM8250_Kernel.zip * -x .git README.md
          else
            echo "Error: Kernel Image not found!"
            exit 1
          fi

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus-SM8250-Kernel
          path: OnePlus_SM8250_Kernel.zip
