name: Build OnePlus SM8250 Kernel (Fixed)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          # Ubuntu 22.04 不再原生支持 python2，需要从 universe 库或手动安装
          sudo apt-get install -y bc bison build-essential flex git curl libssl-dev libncurses5-dev \
          binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi libelf-dev python2-minimal
          # 建立软链接，确保脚本能找到 python
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Clone Source and Toolchain
        run: |
          git clone --depth=1 https://github.com/OnePlusOSS/android_kernel_oneplus_sm8250.git -b oneplus/sm8250_t_13.1_op8 kernel
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang
          # 将 clang 路径加入环境变量
          echo "$(pwd)/clang/bin" >> $GITHUB_PATH

      - name: Hard-Fix Oplus Kernel Gaps (ALL PLACEHOLDER MODE)
        run: |
          set -e
          cd kernel
          echo "🛡️ Oplus Kernel placeholder fix"
          ROOT_DIR="$(pwd)"
          
          # 扫描 Kconfig
          mapfile -t SOURCES < <(grep -RhoE '^[[:space:]]*source[[:space:]]+"[^"]+"' --include='Kconfig*' . | sed -E 's/.*"([^"]+)".*/\1/' | sort -u)
          
          for SRC in "${SOURCES[@]}"; do
            if [[ "$SRC" == *'$('*')'* ]]; then continue; fi
            
            TARGET="$ROOT_DIR/$SRC"
            DIR="$(dirname "$TARGET")"
            
            if [ ! -f "$TARGET" ]; then
              mkdir -p "$DIR"
              cat > "$TARGET" <<EOF
          menu "Dummy placeholder: $SRC"
          config OPLUS_DUMMY_$(echo "$SRC" | tr '/.' '__' | tr 'a-z' 'A-Z')
              bool "Placeholder for $SRC"
              default n
          endmenu
          EOF
            fi
            
            if [ ! -f "$DIR/Makefile" ]; then
              cat > "$DIR/Makefile" <<'EOF'
          obj- :=
          EOF
            fi
          done

          # 修复 Oplus 环境脚本
          if [ -f OplusKernelEnvConfig.mk ]; then
            sed -i 's/FILENAME=- FNR=1/FNR==1/' OplusKernelEnvConfig.mk
          fi

          # 转换 shebang
          grep -rl "^#!.*python$" scripts/ | xargs -r sed -i 's|python$|python3|'

      - name: Compile Kernel
        run: |
          cd kernel
          export ARCH=arm64
          export SUBARCH=arm64
          mkdir -p out
          
          # 显式使用环境变量和绝对路径调用
          make O=out vendor/kona-perf_defconfig PYTHON=python2
          make -j$(nproc --all) O=out \
                CC=clang \
                PYTHON=python2 \
                CLANG_TRIPLE=aarch64-linux-gnu- \
                CROSS_COMPILE=aarch64-linux-gnu- \
                CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
                NM=llvm-nm \
                OBJCOPY=llvm-objcopy \
                OBJDUMP=llvm-objdump \
                STRIP=llvm-strip \
                LD=ld.lld \
                AR=llvm-ar

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Image
          path: kernel/out/arch/arm64/boot/Image*
