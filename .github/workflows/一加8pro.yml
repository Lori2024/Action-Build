name: Build LineageOS-20 Boot Image for OnePlus 8 Pro

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build_lineage:
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y bc bison build-essential curl flex git-lfs libssl-dev libelf-dev \
          python3 rsync zip unzip ccache
        git lfs install

    - name: Setup repo manifest
      run: |
        repo init -u https://github.com/LineageOS/android.git -b lineage-20.0 --git-lfs --no-clone-bundle
        repo sync -j$(nproc) --no-tags --no-clone-bundle

    - name: Setup environment
      run: |
        . build/envsetup.sh
        lunch lineage_instantnoodlep-userdebug

    - name: Compile bootimage (including kernel)
      run: |
        m bootimage -j$(nproc) | tee build.log

    - name: Validate artifact
      run: |
        ls out/target/product/instantnoodlep/boot.img

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: lineageos20-boot
        path: out/target/product/instantnoodlep/boot.img
