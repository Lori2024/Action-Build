name: Build OnePlus SM8250 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    # 修改这里：指定使用 22.04 才能支持你要求的 libncurses5 依赖列表
    runs-on: ubuntu-22.04 

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_oneplus_sm8250
          ref: lineage-20
          path: kernel

      - name: Install Dependencies
        run: |
          sudo apt-get update
          # 完全保留你提供的原始依赖列表，不动任何包名
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 libncurses5 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc tar xz-utils cpio findutils

      - name: Fetch Toolchain (Clang)
        run: |
          mkdir clang
          cd clang
          # 使用适合 LineageOS 20 的 Android 13 官方编译链
          wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master-kernel-build-2022/clang-r450784d.tar.gz
          tar -xf clang-r450784d.tar.gz
          rm clang-r450784d.tar.gz

      - name: Fetch AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git --depth=1 anykernel

      - name: Build Kernel
        run: |
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          cd kernel
          
          # 按照你的指南设置编译环境变量
          export ARCH="arm64"
          export SUBARCH="arm64"
          export CC="clang"
          export LLVM=1
          export LLVM_IAS=1
          export HOSTCC=clang
          export LD=ld.lld
          export CLANG_TRIPLE="aarch64-linux-gnu-"
          
          # 执行编译命令
          # 注意：OnePlus SM8250 的 Lineage 配置文件通常是 vendor/kona_defconfig
          make O=out vendor/kona_defconfig
          make -j$(nproc --all) O=out

      - name: Package with AnyKernel3
        run: |
          # 检查并打包
          IMAGE=$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image
          if [ -f "$IMAGE" ]; then
            cp "$IMAGE" $GITHUB_WORKSPACE/anykernel/
            cd $GITHUB_WORKSPACE/anykernel
            sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
            zip -r9 ../OnePlus_SM8250_Kernel.zip * -x .git README.md
          else
            echo "错误：找不到编译出的 Image 文件"
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_Zip
          path: OnePlus_SM8250_Kernel.zip
