name: Build OnePlus SM8250 Kernel (Fixed)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          # 关键点：安装 python2 及其环境
          sudo apt-get install -y bc bison build-essential flex git curl libssl-dev libncurses5-dev binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi libelf-dev
          # Ubuntu 22.04 安装 python2 的特殊处理
          sudo apt-get install -y python2
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Clone Source and Toolchain
        run: |
          git clone --depth=1 https://github.com/OnePlusOSS/android_kernel_oneplus_sm8250.git -b oneplus/sm8250_s_12.1 kernel
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang
          echo "$(pwd)/clang/bin" >> $GITHUB_PATH

      - name: Fix Source Code Gaps
        run: |
          cd kernel
          # 1. 修复 Kconfig 引用缺失 (uxio_first)
          sed -i '/uxio_first/d' block/Kconfig
          # 2. 修复 Kconfig 引用缺失 (healthinfo)
          sed -i '/healthinfo/d' mm/Kconfig
          # 3. 修复 Oplus 特色功能可能导致的缺失 (根据日志增加)
          sed -i '/oplus_display/d' drivers/video/fbdev/msm/Kconfig
          sed -i '/oplus_display/d' drivers/video/fbdev/msm/Makefile
          # 4. 修复脚本中的 python 声明 (有些脚本强制写死 python)
          grep -rlE "#!.*python" . | xargs sed -i 's/python$/python2/g' || true

      - name: Compile Kernel
        run: |
          cd kernel
          export ARCH=arm64
          export SUBARCH=arm64
          
          # 创建输出目录
          mkdir -p out
          
          # 配置与编译，显式指定 Python 为 python2
          make O=out vendor/kona-perf_defconfig PYTHON=python2
          make -j$(nproc --all) O=out \
                      CC=clang \
                      PYTHON=python2 \
                      CROSS_COMPILE=aarch64-linux-gnu- \
                      CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
                      NM=llvm-nm \
                      OBJCOPY=llvm-objcopy \
                      OBJDUMP=llvm-objdump \
                      STRIP=llvm-strip \
                      LD=ld.lld \
                      AR=llvm-ar

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Image
          path: kernel/out/arch/arm64/boot/Image*
