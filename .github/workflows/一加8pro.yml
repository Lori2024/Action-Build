name: Build OnePlus SM8250 Kernel (Fixed)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          # 关键点：安装 python2 及其环境
          sudo apt-get install -y bc bison build-essential flex git curl libssl-dev libncurses5-dev binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi libelf-dev
          # Ubuntu 22.04 安装 python2 的特殊处理
          sudo apt-get install -y python2
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Clone Source and Toolchain
        run: |
          git clone --depth=1 https://github.com/OnePlusOSS/android_kernel_oneplus_sm8250.git -b oneplus/sm8250_t_13.1_op8 kernel
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang
          echo "$(pwd)/clang/bin" >> $GITHUB_PATH

      - name: Hard-Fix Source Gaps
        run: |
          cd kernel
          
          # 1. 自动删除所有 Kconfig 中引用的但物理上不存在的路径
          # 我们扫描所有 Kconfig，查找 source 语句，如果目标文件不存在，直接删除该行
          echo "🔍 Start deep scanning for missing Kconfig files..."
          find . -name "Kconfig" -type f -print0 | xargs -0 grep -l "source " | while read -r kfile; do
            # 提取所有 source 引用的路径
            grep "source " "$kfile" | sed -E 's/.*source "([^"]+)".*/\1/' | while read -r target; do
              # 处理相对路径：有些是相对于内核根目录，有些是相对于当前目录
              if [ ! -f "$target" ] && [ ! -f "$(dirname $kfile)/$target" ]; then
                echo "🚫 Fixed: Removing missing $target from $kfile"
                # 转义特殊字符并删除匹配行
                escaped_target=$(echo "$target" | sed 's/\//\\\//g')
                sed -i "/source \"$escaped_target\"/d" "$kfile"
              fi
            done
          done

          # 2. 预防性清理：有些模块不仅在 Kconfig，还在 Makefile 中通过 obj-y 引用
          echo "🧹 Cleaning up Makefile ghost references..."
          # 定义常见的缺失目录名
          GHOST_MODS=("uxio_first" "sched_assist" "healthinfo" "memory_isolate" "malloc_track" "task_mem" "cpu_report" "oplus_display")
          for mod in "${GHOST_MODS[@]}"; do
            find . -name "Makefile" -type f -exec sed -i "/$mod/d" {} +
          done

          # 3. 修复 Oplus 环境脚本中的 awk 错误
          sed -i 's/FILENAME=- FNR=1/ /g' OplusKernelEnvConfig.mk || true
          
          # 4. 强制 Python 环境指向 Python2
          grep -rl "#!.*python" scripts/ | xargs sed -i 's/python$/python2/g' || true
          
          echo "✅ Source tree is now clean and ready for compilation."


      - name: Auto-Fix Missing Modules (XDA Style)
        run: |
          cd kernel
          
          # 定义已知可能缺失的路径列表
          MISSING_LIST=(
            # "block/uxio_first"
            # "mm/healthinfo"
            # "mm/memory_isolate"
            # "mm/multi_kswapd"
            # "mm/pms"
            # "mm/task_mem"
            # "mm/malloc_track"
            # "drivers/video/fbdev/msm/oplus_display"
            # "drivers/soc/oplus/performance"
          )

          # 循环检查：如果文件夹不存在，则在父级 Kconfig 中删除它
          for item in "${MISSING_LIST[@]}"; do
            DIR_NAME=$(basename $item)
            PARENT_DIR=$(dirname $item)
            if [ ! -d "$item" ]; then
              echo "⚠️ Warning: Module $item is missing, removing from $PARENT_DIR/Kconfig"
              # 使用 sed 删除包含该模块的行
              sed -i "/$DIR_NAME/d" "$PARENT_DIR/Kconfig" || true
              # 同时也清理 Makefile 中的引用
              sed -i "/$DIR_NAME/d" "$PARENT_DIR/Makefile" || true
            fi
          done

          # 针对 OPLUS 的特殊环境配置修复
          # 修复可能导致 awk 崩溃的 OplusKernelEnvConfig
          sed -i 's/FILENAME=- FNR=1/ /g' OplusKernelEnvConfig.mk || true
          
          # 强制将脚本中的 python 指向 python2
          grep -rl "#!.*python" scripts/ | xargs sed -i 's/python$/python2/g' || true

      - name: Compile Kernel
        run: |
          cd kernel
          export ARCH=arm64
          export SUBARCH=arm64
          
          # 创建输出目录
          mkdir -p out
          
          # 配置与编译，显式指定 Python 为 python2
          make O=out vendor/kona-perf_defconfig PYTHON=python2
          make -j$(nproc --all) O=out \
                      CC=clang \
                      PYTHON=python2 \
                      CROSS_COMPILE=aarch64-linux-gnu- \
                      CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
                      NM=llvm-nm \
                      OBJCOPY=llvm-objcopy \
                      OBJDUMP=llvm-objdump \
                      STRIP=llvm-strip \
                      LD=ld.lld \
                      AR=llvm-ar

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Image
          path: kernel/out/arch/arm64/boot/Image*
