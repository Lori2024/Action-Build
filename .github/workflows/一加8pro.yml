name: Build OnePlus SM8250 Kernel (Fixed)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          # 关键点：安装 python2 及其环境
          sudo apt-get install -y bc bison build-essential flex git curl libssl-dev libncurses5-dev binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi libelf-dev
          # Ubuntu 22.04 安装 python2 的特殊处理
          sudo apt-get install -y python2
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Clone Source and Toolchain
        run: |
          git clone --depth=1 https://github.com/OnePlusOSS/android_kernel_oneplus_sm8250.git -b oneplus/sm8250_t_13.1_op8 kernel
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang
          echo "$(pwd)/clang/bin" >> $GITHUB_PATH

      - name: Hard-Fix Source Gaps & Cleanup (Double Insurance)
        run: |
          cd kernel
          
          # 【1】手动定义的必须删除目录清单
          # 哪怕文件夹存在，也要强制从 Kconfig/Makefile 中剥离
          MUST_REMOVE=(
            "block/uxio_first"
            "mm/healthinfo"
            "mm/memory_isolate"
            "mm/multi_kswapd"
            "mm/pms"
            "mm/task_mem"
            "mm/malloc_track"
            "mm/cpu_report"
            "kernel/sched_assist"
            "drivers/video/fbdev/msm/oplus_display"
            "drivers/soc/oplus/performance"
            "fs/proc/healthinfo/Kconfig"
          )

          echo "🗑️ Step 1: Force removing manually defined modules..."
          for item in "${MUST_REMOVE[@]}"; do
            DIR_NAME=$(basename $item)
            PARENT_DIR=$(dirname $item)
            # 从父级 Kconfig 删除引用
            if [ -f "$PARENT_DIR/Kconfig" ]; then
              sed -i "/$DIR_NAME/d" "$PARENT_DIR/Kconfig" || true
            fi
            # 从父级 Makefile 删除引用
            if [ -f "$PARENT_DIR/Makefile" ]; then
              sed -i "/$DIR_NAME/d" "$PARENT_DIR/Makefile" || true
            fi
            echo "✔️ Forced removal of $item"
          done

          echo "🔍 Step 2: Deep scanning for other missing Kconfig files..."
          # 自动扫描：如果 Kconfig 引用了物理上不存在的文件，直接删除该行
          find . -name "Kconfig" -type f -print0 | xargs -0 grep -l "source " | while read -r kfile; do
            grep "source " "$kfile" | sed -E 's/.*source "([^"]+)".*/\1/' | while read -r target; do
              # 检查物理文件是否存在
              if [ ! -f "$target" ] && [ ! -f "$(dirname $kfile)/$target" ]; then
                echo "🚫 Auto-fixed ghost reference: $target in $kfile"
                escaped_target=$(echo "$target" | sed 's/\//\\\//g')
                sed -i "/source \"$escaped_target\"/d" "$kfile"
              fi
            done
          done

          echo "🛠️ Step 3: Environment & Encoding Fixes..."
          # 修复 Oplus 环境脚本 awk 错误
          sed -i 's/FILENAME=- FNR=1/ /g' OplusKernelEnvConfig.mk || true
          # 修复非法字符警告
          if [ -f "mm/damon/Kconfig" ]; then
            tr -cd '\11\12\15\40-\176' < mm/damon/Kconfig > mm/damon/Kconfig.tmp && mv mm/damon/Kconfig.tmp mm/damon/Kconfig
          fi
          # 强制 Python 2
          grep -rl "#!.*python" scripts/ | xargs sed -i 's/python$/python2/g' || true
          
          echo "✅ Cleanup complete. Ready to build."

      - name: Compile Kernel
        run: |
          cd kernel
          export ARCH=arm64
          export SUBARCH=arm64
          
          # 创建输出目录
          mkdir -p out
          
          # 配置与编译，显式指定 Python 为 python2
          make O=out vendor/kona-perf_defconfig PYTHON=python2
          make -j$(nproc --all) O=out \
                      CC=clang \
                      PYTHON=python2 \
                      CROSS_COMPILE=aarch64-linux-gnu- \
                      CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
                      NM=llvm-nm \
                      OBJCOPY=llvm-objcopy \
                      OBJDUMP=llvm-objdump \
                      STRIP=llvm-strip \
                      LD=ld.lld \
                      AR=llvm-ar

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Image
          path: kernel/out/arch/arm64/boot/Image*
