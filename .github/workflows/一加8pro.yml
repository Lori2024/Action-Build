name: Build OnePlus SM8250 Kernel (Fixed)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          # 关键点：安装 python2 及其环境
          sudo apt-get install -y bc bison build-essential flex git curl libssl-dev libncurses5-dev binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi libelf-dev
          # Ubuntu 22.04 安装 python2 的特殊处理
          sudo apt-get install -y python2
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Clone Source and Toolchain
        run: |
          git clone --depth=1 https://github.com/OnePlusOSS/android_kernel_oneplus_sm8250.git -b oneplus/sm8250_t_13.1_op8 kernel
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang
          echo "$(pwd)/clang/bin" >> $GITHUB_PATH

      - name: Hard-Fix Specified Gaps
        run: |
          cd kernel
          
          # 【1】定义你确认要剔除的目录或文件
          # 脚本会自动在父级 Kconfig/Makefile 中删除对这些名字的引用
          MUST_REMOVE=(
            "block/uxio_first"
            "mm/healthinfo"
            "mm/memory_isolate"
            "mm/multi_kswapd"
            "mm/pms"
            "mm/task_mem"
            "mm/malloc_track"
            "mm/cpu_report"
            "kernel/sched_assist"
            "drivers/video/fbdev/msm/oplus_display"
            "drivers/soc/oplus/performance"
            "fs/proc/healthinfo"
          )

          echo "🗑️ Step 1: Removing specified modules from build tree..."
          for item in "${MUST_REMOVE[@]}"; do
            DIR_NAME=$(basename $item)
            PARENT_DIR=$(dirname $item)
            
            # 从父级 Kconfig 删除引用行 (例如 source "xxx/Kconfig")
            if [ -f "$PARENT_DIR/Kconfig" ]; then
              echo "✔️ Cleaning $PARENT_DIR/Kconfig"
              sed -i "/$DIR_NAME/d" "$PARENT_DIR/Kconfig" || true
            fi
            
            # 从父级 Makefile 删除编译行 (例如 obj-y += xxx/)
            if [ -f "$PARENT_DIR/Makefile" ]; then
              echo "✔️ Cleaning $PARENT_DIR/Makefile"
              sed -i "/$DIR_NAME/d" "$PARENT_DIR/Makefile" || true
            fi
          done

          echo "🛠️ Step 2: Critical Environment Fixes..."
          # 必须修复：否则 Oplus 的编译环境配置脚本会报错停止
          sed -i 's/FILENAME=- FNR=1/ /g' OplusKernelEnvConfig.mk || true
          
          # 必须修复：将内核脚本内部引用的 python 强制指向 python2 (GitHub 默认是 python3)
          grep -rl "#!.*python" scripts/ | xargs sed -i 's/python$/python2/g' || true
          
          # 修复 damon 警告 (可选，但建议保留以保持日志清洁)
          if [ -f "mm/damon/Kconfig" ]; then
            tr -cd '\11\12\15\40-\176' < mm/damon/Kconfig > mm/damon/Kconfig.tmp && mv mm/damon/Kconfig.tmp mm/damon/Kconfig
          fi
          
          echo "✅ Cleanup of specified modules complete."

      - name: Compile Kernel
        run: |
          cd kernel
          export ARCH=arm64
          export SUBARCH=arm64
          
          # 创建输出目录
          mkdir -p out
          
          # 配置与编译，显式指定 Python 为 python2
          make O=out vendor/kona-perf_defconfig PYTHON=python2
          make -j$(nproc --all) O=out \
                      CC=clang \
                      PYTHON=python2 \
                      CROSS_COMPILE=aarch64-linux-gnu- \
                      CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
                      NM=llvm-nm \
                      OBJCOPY=llvm-objcopy \
                      OBJDUMP=llvm-objdump \
                      STRIP=llvm-strip \
                      LD=ld.lld \
                      AR=llvm-ar

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Image
          path: kernel/out/arch/arm64/boot/Image*
