name: Build OnePlus SM8250 Kernel (Fixed)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          # Ubuntu 22.04 不再原生支持 python2，需要从 universe 库或手动安装
          sudo apt-get install -y bc bison build-essential flex git curl libssl-dev libncurses5-dev \
          binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi libelf-dev python2-minimal
          # 建立软链接，确保脚本能找到 python
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Clone Source and Toolchain
        run: |
          git clone --depth=1 https://github.com/OnePlusOSS/android_kernel_oneplus_sm8250.git -b oneplus/sm8250_t_13.1_op8 kernel
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang
          # 将 clang 路径加入环境变量
          echo "$(pwd)/clang/bin" >> $GITHUB_PATH

      - name: Hard-Fix Oplus Kernel Gaps (ALL PLACEHOLDER MODE)
        run: |
          set -e
          cd kernel
          echo "🛡️ Oplus Kernel placeholder fix"
          ROOT_DIR="$(pwd)"
          
          # 扫描 Kconfig
          mapfile -t SOURCES < <(grep -RhoE '^[[:space:]]*source[[:space:]]+"[^"]+"' --include='Kconfig*' . | sed -E 's/.*"([^"]+)".*/\1/' | sort -u)
          
          for SRC in "${SOURCES[@]}"; do
                    [[ "$SRC" == *'$('*')'* ]] && continue
                    
                    TARGET="$ROOT_DIR/$SRC"
                    DIR="$(dirname "$TARGET")"
                    
                    # 1. 检查父目录路径冲突
                    if [ -e "$DIR" ] || [ -L "$DIR" ]; then
                      if [ ! -d "$DIR" ]; then
                        echo "  ⚠️ Skipping: $DIR is a file or link, cannot create directory."
                        continue
                      fi
                    else
                      # 路径不存在，尝试创建
                      mkdir -p "$DIR" 2>/dev/null || { echo "  ❌ Failed to mkdir $DIR"; continue; }
                    fi
          
                    # 2. 检查目标文件冲突
                    if [ -e "$TARGET" ] || [ -L "$TARGET" ]; then
                      echo "  ℹ️ Skipping: $TARGET already exists."
                      continue
                    fi
          
                    # 3. 只有确认无冲突后才创建占位符
                    echo "  ➕ Creating placeholder: $SRC"
                    cat > "$TARGET" <<EOF || true
          menu "Dummy placeholder: $SRC"
          config OPLUS_DUMMY_$(echo "$SRC" | tr '/.' '__' | tr 'a-z' 'A-Z')
              bool "Placeholder for $SRC"
              default n
          endmenu
          EOF
          
                    # 4. 补齐 Makefile (同样检查是否存在)
                    if [ ! -e "$DIR/Makefile" ]; then
                      cat > "$DIR/Makefile" <<'EOF' || true
          obj- :=
          EOF
                    fi
                  done

      - name: Compile Kernel
        run: |
          cd kernel
          export ARCH=arm64
          export SUBARCH=arm64
          mkdir -p out
          
          # 显式使用环境变量和绝对路径调用
          make O=out vendor/kona-perf_defconfig PYTHON=python2
          make -j$(nproc --all) O=out \
                CC=clang \
                PYTHON=python2 \
                CLANG_TRIPLE=aarch64-linux-gnu- \
                CROSS_COMPILE=aarch64-linux-gnu- \
                CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
                NM=llvm-nm \
                OBJCOPY=llvm-objcopy \
                OBJDUMP=llvm-objdump \
                STRIP=llvm-strip \
                LD=ld.lld \
                AR=llvm-ar

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Image
          path: kernel/out/arch/arm64/boot/Image*
