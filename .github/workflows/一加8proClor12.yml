name: Check OnePlus 8 Pro Config
on:
  workflow_dispatch:

jobs:
  check-config:
    runs-on: ubuntu-22.04
    env:
      KERNEL_CMDLINE: ARCH=arm64 SUBARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- O=out
    steps:
      - name: 安装基础工具
        run: |
          sudo apt-get update
          sudo apt install gcc-aarch64-linux-gnu binutils make bison flex libssl-dev -y

      - name: 拉取源码 (仅 Android 12 分支)
        run: |
          git clone --depth=1 -b oneplus/sm8250_s_12.1 https://github.com/OnePlusOSS/android_kernel_oneplus_sm8250.git kernel_source

      - name: 暴力修复路径并生成配置
        run: |
          cd kernel_source
          
          # 1. 修复 Oplus 脚本语法错误
          sed -i 's/awk '\''{print $NF}'\''/awk '\''{print \$NF}'\''/g' OplusKernelEnvConfig.mk || true
          
          # 2. 自动剔除所有源码中不存在的 Kconfig 引用 (关键一步)
          find . -name "Kconfig*" | while read -r kfile; do
            grep "source " "$kfile" | cut -d'"' -f2 | while read -r src_path; do
              if [ ! -e "$src_path" ] && [ ! -e "$(dirname $kfile)/$src_path" ]; then
                echo "移除不存在的引用: $src_path"
                sed -i "\|\"$src_path\"|d" "$kfile"
              fi
            done
          done

          # 3. 生成配置
          make $KERNEL_CMDLINE vendor/instantnoodlep_defconfig

          # 4. 验证结果
          if [ -f out/.config ]; then
            echo "======================================"
            echo "✅ 成功！配置文件已生成在 out/.config"
            echo "======================================"
            tail -n 20 out/.config
          else
            echo "❌ 失败：未发现配置文件"
            exit 1
          fi
