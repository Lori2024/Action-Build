name: Build OnePlus SM8250 Kernel

on:
  workflow_dispatch: # 手动触发编译
  push:
    branches: [ "oneplus/sm8250_s_12.1" ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: oneplus/sm8250_s_12.1
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex git curl libssl-dev libncurses5-dev python3 binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

      - name: Setup Toolchain (Proton Clang)
        run: |
          mkdir clang
          cd clang
          curl -LO https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.tar.gz
          tar -xf master.tar.gz --strip-components=1
          echo "$(pwd)/bin" >> $GITHUB_PATH

      - name: Compile Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          # 生成配置文件 (根据 OnePlus SM8250 实际情况调整)
          make O=out vendor/kona-perf_defconfig
          
          # 执行编译
          make -j$(nproc --all) O=out \
                      CC=clang \
                      CROSS_COMPILE=aarch64-linux-gnu- \
                      CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
                      LD=ld.lld \
                      AR=llvm-ar \
                      NM=llvm-nm \
                      OBJCOPY=llvm-objcopy \
                      OBJDUMP=llvm-objdump \
                      STRIP=llvm-strip

      - name: Check Output
        run: |
          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
              echo "KERNEL_FILE=out/arch/arm64/boot/Image.gz-dtb" >> $GITHUB_ENV
          elif [ -f out/arch/arm64/boot/Image ]; then
              echo "KERNEL_FILE=out/arch/arm64/boot/Image" >> $GITHUB_ENV
          fi

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus-SM8250-Kernel
          path: ${{ env.KERNEL_FILE }}
