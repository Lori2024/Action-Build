name: OP8P Official Config Check
on:
  workflow_dispatch:

jobs:
  make-config:
    runs-on: ubuntu-22.04
    env:
      # 严格参考官方要求的编译参数
      KERNEL_CMDLINE: "ARCH=arm64 SUBARCH=arm64 O=out CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CLANG_TRIPLE=aarch64-linux-gnu-"
    steps:
      - name: 安装基础环境
        run: |
          sudo apt-get update
          sudo apt install gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils make bison flex libssl-dev python2 -y
          # 一加脚本强制依赖 python2
          sudo rm -f /usr/bin/python && sudo ln -s /usr/bin/python2.7 /usr/bin/python

      - name: 拉取官方源码 (SM8250 A12)
        run: |
          git clone --depth=1 -b oneplus/sm8250_s_12.1 https://github.com/OnePlusOSS/android_kernel_oneplus_sm8250.git kernel_source

      - name: 下载 Clang (Horizon 16.0.6)
        run: |
          wget https://github.com/tomxi1997/op8-kernel-source/releases/download/v1/Horizon-Clang-16.0.6.tar.xz
          sudo mkdir -p /clang
          sudo tar -xJvf Horizon-Clang-16.0.6.tar.xz -C /clang

      - name: 仅生成官方配置
        run: |
          cd kernel_source
          export PATH=/clang/bin:$PATH
          # 注意：官方 A12 分支必须带 vendor/ 前缀
          make $KERNEL_CMDLINE CC="clang" vendor/instantnoodlep_defconfig

      - name: 验证配置结果
        run: |
          if [ -f kernel_source/out/.config ]; then
            echo "✅ 官方配置生成成功"
            tail -n 20 kernel_source/out/.config
          else
            echo "❌ 配置生成失败"
            exit 1
          fi
